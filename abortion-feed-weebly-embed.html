<div class="ab">

            </div>
        </div>

        </div>

        <div class="ab-list" id="abList"><div class="ab-state">Loading the wire…</div></div>
    </section>

    <div class="ab-sheet" id="abSheetAbout" role="dialog" aria-label="How this feed works">
        <button class="ab-sheet-close" data-close aria-label="Close">×</button>
        <p class="ab-note">
            <strong>What this is.</strong> A feed on abortion worldwide: statutes and court rulings, referendums
            and bills, clinics and travel, medication and telehealth, prosecutions, health outcomes and data, the
            international bodies and the aid attached to them, the movements on both sides, and the data-privacy
            fights that now come with all of it. Nothing here is written or summarised: headlines and snippets are
            the publishers' own, every row links to the original, and no model touches the text.
        </p>
        <p class="ab-note">
            <strong>Both movements are carried.</strong> This is a contested subject, and the feed is built to
            show the argument rather than to settle it. Abortion-rights organisations and anti-abortion
            organisations both have wires here, each labelled on every row it produces, alongside courts, health
            institutions, research and general press. Standing is provenance, not endorsement: it tells you who
            is speaking so you can weigh what they say. Filter to one standing to read a single side, or leave it
            open to read the argument.
        </p>
        <p class="ab-note">
            <strong>Weight.</strong> Separately, each story is scored on what it contains: a decision — a ruling,
            a law enacted, a referendum result, a conviction (2); institutional material — WHO or UN guidance,
            official statistics, a health ministry, a peer-reviewed study (2); a measured figure (1); a pending
            decision with a date attached (1); a named jurisdiction (1); and a primary source (1). At three or
            more the row is marked consequential, and the <em>Weight</em> filter narrows to those. A campaign
            statement and a constitutional judgment both appear here; the pips are how you tell them apart at a
            glance, and the words beside them say what earned the score.
        </p>
        <p class="ab-note">
            <strong>What is refused.</strong> The word <em>abort</em> in its other senses — aborted launches,
            landings, mergers and transactions — plus the usual commercial and horoscope noise. The status line
            reports how many stories each harvest refused.
        </p>
        <p class="ab-note">
            <strong>Limits worth knowing.</strong> The gate is mechanical: it reads words, not meaning. Standing
            is assigned per wire rather than per article, so a straight news piece from an advocacy outlet still
            carries that outlet's label, and a slanted piece from a wire service does not. The balance of the feed
            depends on the balance of the source list, which is in <code>sources_abortion.json</code> and is meant
            to be edited. Google News caps a query at roughly 100 results over about 30 days. Coverage is uneven
            by language and the counts show it rather than hiding it.
        </p>
    </div>

        </p>

<script>
(function () {
'use strict';

const REPO = 'WelcomeToYourGalaxy/abortion-feed';
const BRANCH = 'main';
const ENDPOINTS = [
    () => 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/wire_abortion.json?t=' + Date.now(),
    () => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/wire_abortion.json'
];

const TOPIC_COLOR = {
    courts: '#9fb8ff',        // indigo
    legislation: '#6f9bff',   // azure
    access: '#7fd3d8',        // teal
    medication: '#8de6c8',    // mint
    enforcement: '#e0607f',   // rose
    health: '#6fd3ff',        // cyan
    international: '#a98cf0', // violet
    movements: '#cf6fd8',     // magenta
    privacy: '#9fb0c8',       // slate
    crisis: '#e29ad8'         // pink
};
// Standing colours are deliberately neutral in tone: the two advocacy labels
// are as visually equal as the palette allows.
const STANDING_COLOR = {
    official: '#9fb8ff', research: '#8de6c8', press: '#9fb0c8',
    rights: '#7fd3d8', antiabortion: '#c9a9e8'
};
const WINDOWS = [
    { id: 'd1', label: '24 hours', ms: 864e5 },
    { id: 'd7', label: '7 days', ms: 7 * 864e5 },
    { id: 'd30', label: '30 days', ms: 30 * 864e5 },
    // the wire keeps 45 days, so anything past a month is reachable on its own
    { id: 'older', label: 'Older than 30 days', ms: 30 * 864e5, older: true },
    { id: 'all', label: 'Everything', ms: null }
];

const EVIDENCE = [
    { id: 'all', label: 'Any' },
    { id: 'doc', label: 'Consequential only' }
];

const state = { items: [], topics: [], languages: {}, sources: [], generated: null,
                geo: [], standings: [], docScore: 3, topic: 'all', standing: 'all', place: 'all',
                langs: new Set(), when: 'all', evidence: 'all', query: '', shown: 50, loading: false };

const $list = document.getElementById('abList');
const $status = document.getElementById('abStatus');
const $dot = document.getElementById('abDot');
const $prog = document.getElementById('abProgress');
const $topicRow = document.getElementById('abTopicRow');
const $standingRow = document.getElementById('abRegionRow');
const $evidenceRow = document.getElementById('abEvidenceRow');
const $geoRow = document.getElementById('abGeoRow');
const $langRow = document.getElementById('abLangRow');
const $whenRow = document.getElementById('abWhenRow');
const $search = document.getElementById('abSearch');
const $srcGrid = document.getElementById('abSrcGrid');
const $refresh = document.getElementById('abRefresh');
const $more = document.createElement('button');
$more.className = 'ab-more';
$more.addEventListener('click', () => { state.shown += 50; render(); });

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function timeAgo(ts) {
    if (!ts) return 'undated';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    return d < 30 ? d + 'd ago' : new Date(ts).toISOString().slice(0, 10);
}
function langName(c) { return state.languages[c] || c; }
function placeLabel(places) {
    const named = places.filter(p => p !== 'unlocated');
    if (!named.length) return 'unplaced';
    return named.map(p => {
        const g = state.geo.find(g => g.id === p);
        return g ? g.label : p;
    }).slice(0, 3).join(' · ');
}
function topicLabel(id) { const t = state.topics.find(t => t.id === id); return t ? t.label : id; }
function setStatus(text, cls) { $status.textContent = text; $dot.className = 'ab-dot' + (cls ? ' ' + cls : ''); }

async function load() {
    if (state.loading) return;
    state.loading = true; $refresh.disabled = true; $prog.style.width = '40%';
    setStatus('Loading the wire…', '');

    let data = null, err = null;
    for (const ep of ENDPOINTS) {
        try {
            const res = await fetch(ep(), { cache: 'no-store' });
            if (!res.ok) { err = 'HTTP ' + res.status; continue; }
            data = await res.json(); break;
        } catch (e) { err = e.message; }
    }
    $prog.style.width = '100%';

    if (!data || !Array.isArray(data.items)) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        setStatus('The wire could not be read' + (err ? ' (' + err + ')' : '') + '. Press Refresh.', 'error');
        render(); return;
    }

    state.items = data.items.map(i => ({
        title: i.t, link: i.u, outlet: i.o, lang: i.g, region: i.r,
        kind: i.k, ts: i.d, snippet: i.s, topics: i.x || ['climate'],
        score: i.p || 0, why: i.y || [], places: i.w || ['unlocated'],
        standing: i.st || 'press'
    }));
    state.docScore = data.notable_score || 3;
    state.standings = data.standings || [];
    state.topics = data.topics || [];
    state.languages = data.languages || {};
    state.geo = data.geo || [];
    state.sources = data.sources || [];
    state.generated = data.generated ? Date.parse(data.generated) : null;

    buildChips(); renderSources();

    const c = data.counts || {};
    const ageH = state.generated ? (Date.now() - state.generated) / 3600000 : null;
    const docd = state.items.filter(i => i.score >= state.docScore).length;
    setStatus(
        (c.stories || state.items.length) + ' stories · ' + docd + ' consequential · ' +
        (c.refused ? c.refused + ' refused · ' : '') +
        (c.languages || new Set(state.items.map(i => i.lang)).size) + ' languages · ' +
        (c.wires_ok || '?') + '/' + (c.wires_total || '?') + ' wires answered · harvested ' +
        (state.generated ? timeAgo(state.generated) : 'unknown'),
        ageH !== null && ageH > 6 ? 'idle' : ''
    );

    state.loading = false; $refresh.disabled = false;
    setTimeout(() => { $prog.style.width = '0'; }, 400);
    render();
}

function withinWindow(i, win) {
    const w = WINDOWS.find(w => w.id === (win || state.when));
    if (!w || !w.ms) return true;
    if (!i.ts) return false;
    const age = Date.now() - i.ts;
    return w.older ? age > w.ms : age <= w.ms;
}

function visible() {
    const q = state.query.toLowerCase();
    return state.items.filter(i => {
        if (state.topic !== 'all' && i.topics.indexOf(state.topic) === -1) return false;
        if (state.standing !== 'all' && i.standing !== state.standing) return false;
        if (state.evidence === 'doc' && i.score < state.docScore) return false;
        if (state.place !== 'all' && i.places.indexOf(state.place) === -1) return false;
        if (state.langs.size && !state.langs.has(i.lang)) return false;
        if (!withinWindow(i)) return false;
        if (q && (i.title + ' ' + i.snippet + ' ' + i.outlet).toLowerCase().indexOf(q) === -1) return false;
        return true;
    }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function render() {
    const items = visible(), slice = items.slice(0, state.shown);
    if (!slice.length) {
        $list.innerHTML = '<div class="ab-state">' + (
            state.loading ? 'Loading the wire…'
            : state.items.length ? '<strong>Nothing matches these filters.</strong><br>Widen the window, the subject or the language.'
            : '<strong>No stories loaded.</strong><br>Press Refresh, or check that the harvester has run.'
        ) + '</div>';
    } else {
        $list.innerHTML = slice.map(i => {
            const tags = i.topics.map(id => {
                const c = TOPIC_COLOR[id] || '#9fb0c8';
                return '<span class="ab-t" style="color:' + c + ';border-color:' + c + '55">' + esc(topicLabel(id)) + '</span>';
            }).join('');
            const documented = i.score >= state.docScore;
            const sc = STANDING_COLOR[i.standing] || '#9fb0c8';
            const stLabel = (state.standings.find(s => s.id === i.standing) || {}).label || i.standing;
            const pips = '<span class="ab-scale" title="weight score ' + i.score + '">' +
                [1,2,3,4,5].map(n => '<span class="ab-pip' + (n <= Math.min(i.score,5) ? ' on' : '') + '"></span>').join('') +
                '</span>';
            return '<a class="ab-item' + (documented ? ' watch' : '') + '" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="ab-meta"><span class="ab-lang">' + esc(langName(i.lang)) + '</span>' +
                '<span class="ab-standing" style="color:' + sc + ';border-color:' + sc + '55">' + esc(stLabel) + '</span>' +
                '<span>' + esc(i.outlet) + '</span>' +
                '<span>' + esc(placeLabel(i.places)) + '</span>' +
                pips + (i.why.length ? '<span class="ab-why">' + esc(i.why.join(' · ')) + '</span>' : '') +
                '<span>' + timeAgo(i.ts) + '</span></div>' +
                '<div class="ab-item-title">' + esc(i.title) + '</div>' +
                (i.snippet ? '<div class="ab-snip">' + esc(i.snippet) + '</div>' : '') +
                '<div class="ab-tags">' + tags + '</div></a>';
        }).join('');
        if (items.length > state.shown) {
            $more.textContent = 'Show more (' + (items.length - state.shown) + ' remaining)';
            $list.appendChild($more);
        }
    }
    chipCounts();
}

function chip(row, key, value, label, color) {
    const c = document.createElement('button');
    c.className = 'ab-chip';
    c.dataset[key] = value;
    if (color) c.style.setProperty('--chipcolor', color);
    c.innerHTML = esc(label) + ' <span class="ab-n"></span>';
    row.appendChild(c);
    return c;
}

function buildChips() {
    [$topicRow, $geoRow, $standingRow, $evidenceRow, $langRow, $whenRow].forEach(r => r.querySelectorAll('.ab-chip').forEach(c => c.remove()));

    chip($topicRow, 'topic', 'all', 'All').classList.add('on');
    state.topics.forEach(t => chip($topicRow, 'topic', t.id, t.label, TOPIC_COLOR[t.id]));

    chip($geoRow, 'place', 'all', 'Everywhere').classList.add('on');
    state.geo.forEach(g => {
        const c = chip($geoRow, 'place', g.id, g.label);
        if (g.id === state.place) c.classList.add('on');
    });

    chip($standingRow, 'standing', 'all', 'All').classList.add('on');
    state.standings.forEach(st => {
        const c = chip($standingRow, 'standing', st.id, st.label);
        c.style.setProperty('--chipcolor', STANDING_COLOR[st.id] || '#e8eef7');
        if (st.id === state.standing) c.classList.add('on');
    });

    EVIDENCE.forEach(e => {
        const c = chip($evidenceRow, 'evidence', e.id, e.label);
        if (e.id === state.evidence) c.classList.add('on');
    });

    Object.keys(state.languages).sort((a, b) => langName(a).localeCompare(langName(b)))
        .forEach(code => chip($langRow, 'lang', code, langName(code)));

    WINDOWS.forEach(w => {
        const c = chip($whenRow, 'when', w.id, w.label);
        if (w.id === state.when) c.classList.add('on');
    });

}

function chipCounts() {
    const q = state.query.toLowerCase();
    const base = state.items.filter(i =>
        (!q || (i.title + ' ' + i.snippet).toLowerCase().indexOf(q) !== -1) && withinWindow(i));
    $topicRow.querySelectorAll('.ab-chip').forEach(c => {
        const id = c.dataset.topic;
        const n = id === 'all' ? base.length : base.filter(i => i.topics.indexOf(id) !== -1).length;
        c.querySelector('.ab-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $geoRow.querySelectorAll('.ab-chip').forEach(c => {
        const g = c.dataset.place;
        const n = g === 'all' ? base.length : base.filter(i => i.places.indexOf(g) !== -1).length;
        c.querySelector('.ab-n').textContent = n;
        c.classList.toggle('empty', n === 0 && g !== 'all');
    });
    $standingRow.querySelectorAll('.ab-chip').forEach(c => {
        const r = c.dataset.standing;
        const n = r === 'all' ? base.length : base.filter(i => i.standing === r).length;
        c.querySelector('.ab-n').textContent = n;
        c.classList.toggle('empty', n === 0 && r !== 'all');
    });
    $evidenceRow.querySelectorAll('.ab-chip').forEach(c => {
        const id = c.dataset.evidence;
        c.querySelector('.ab-n').textContent =
            id === 'doc' ? base.filter(i => i.score >= state.docScore).length : base.length;
    });
    $langRow.querySelectorAll('.ab-chip').forEach(c => {
        const n = base.filter(i => i.lang === c.dataset.lang).length;
        c.querySelector('.ab-n').textContent = n;
        c.classList.toggle('empty', n === 0);
    });
    $whenRow.querySelectorAll('.ab-chip').forEach(c => {
        const n = state.items.filter(i => withinWindow(i, c.dataset.when)).length;
        c.querySelector('.ab-n').textContent = n;
        // the archive chip only appears once there is an archive
        if (c.dataset.when === 'older') c.style.display = n ? '' : 'none';
    });
}

function renderSources() {
    $srcGrid.innerHTML = state.sources.map(s =>
        '<div class="ab-src ' + (s.ok ? '' : 'fail') + '"><span>' + esc(s.name) + '</span>' +
        '<span>' + (s.ok ? s.kept + ' kept' + (s.refused ? ' · ' + s.refused + ' refused' : '') : 'unreachable') +
        '</span></div>').join('');
}

/* ---- Wiring ---- */
function single(row, key) {
    row.addEventListener('click', e => {
        const c = e.target.closest('.ab-chip'); if (!c) return;
        state[key] = c.dataset[key]; state.shown = 50;
        row.querySelectorAll('.ab-chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    });
}
single($topicRow, 'topic');
single($standingRow, 'standing');
single($evidenceRow, 'evidence');
single($geoRow, 'place');
single($whenRow, 'when');

$langRow.addEventListener('click', e => {
    const c = e.target.closest('.ab-chip'); if (!c) return;
    const code = c.dataset.lang;
    if (state.langs.has(code)) state.langs.delete(code); else state.langs.add(code);
    c.classList.toggle('on', state.langs.has(code));
    state.shown = 50; render();
});

$refresh.addEventListener('click', load);
document.getElementById('abClear').addEventListener('click', () => {
    state.topic = 'all'; state.standing = 'all'; state.evidence = 'all'; state.place = 'all';
    state.langs.clear(); state.when = 'all';
    state.query = ''; state.shown = 50; $search.value = '';
    $topicRow.querySelectorAll('.ab-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === 'all'));
    $standingRow.querySelectorAll('.ab-chip').forEach(c => c.classList.toggle('on', c.dataset.standing === 'all'));
    $evidenceRow.querySelectorAll('.ab-chip').forEach(c => c.classList.toggle('on', c.dataset.evidence === 'all'));
    $geoRow.querySelectorAll('.ab-chip').forEach(c => c.classList.toggle('on', c.dataset.place === 'all'));
    $langRow.querySelectorAll('.ab-chip').forEach(c => c.classList.remove('on'));
    $whenRow.querySelectorAll('.ab-chip').forEach(c => c.classList.toggle('on', c.dataset.when === 'all'));
    render();
});
let timer;
$search.addEventListener('input', e => {
    clearTimeout(timer); const v = e.target.value;
    timer = setTimeout(() => { state.query = v; state.shown = 50; render(); }, 180);
});

document.querySelectorAll('.ab-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const sheet = document.getElementById(tab.dataset.sheet);
        const opening = !sheet.classList.contains('open');
        document.querySelectorAll('.ab-sheet').forEach(s => s.classList.remove('open'));
        document.querySelectorAll('.ab-tab').forEach(t => t.classList.remove('on'));
        if (opening) { sheet.classList.add('open'); tab.classList.add('on'); }
    });
});
document.querySelectorAll('.ab-sheet [data-close]').forEach(b => {
    b.addEventListener('click', () => {
        b.closest('.ab-sheet').classList.remove('open');
        document.querySelectorAll('.ab-tab').forEach(t => t.classList.remove('on'));
    });
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.ab-sheet').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.ab-tab').forEach(t => t.classList.remove('on'));
});

load();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
})();
